[project]
name = "nucleo"
version = "1.0.0"
description = "Pacote pai: login, auth, dados e blocos de UI compartilhados pelos apps filhos"
requires-python = ">=3.10"
dependencies = ["flet>=1.0,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
