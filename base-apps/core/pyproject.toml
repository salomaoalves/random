[project]
name = "base-apps-core"
version = "1.0.0"
description = "Parent package: login, auth, data, i18n and UI blocks shared by the child apps"
requires-python = ">=3.10"
dependencies = ["flet>=1.0,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
